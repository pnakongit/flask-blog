version: "3.8"

services:
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    entrypoint: [ "./boot.sh" ]
    restart: always
    env_file:
      - .flaskenv
    depends_on:
      - elasticsearch


  elasticsearch:
    image: elasticsearch:9.0.3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    expose:
      - 9200
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
    volumes:
      - es_data:/usr/share/elasticsearch/data


  db:
    image: postgres:alpine
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - 5432
    env_file:
      - .flaskenv
volumes:
  es_data:
  pg_data:
